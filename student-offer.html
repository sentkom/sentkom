<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      name="description"
      content="Explore SENTKOM's student project offer for academic projects, prototypes and technical support."
    />
    <title>College Student Offer | SENTKOM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=DM+Sans:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="student-offer-page">
    <main class="student-offer-screen">
      <div class="student-offer-scene" aria-label="College student offer banner">
        <div class="offer-lamp" aria-hidden="true"></div>

        <div class="offer-cap" aria-hidden="true">
          <div class="cap-top"></div>
          <div class="cap-hat"></div>
          <div class="cap-tassel"></div>
        </div>

        <div class="offer-books" aria-hidden="true">
          <span class="book book-a"></span>
          <span class="book book-b"></span>
          <span class="book book-c"></span>
        </div>

        <div class="offer-card">
          <div class="offer-badge">
            <span class="badge-icon" aria-hidden="true">🎓</span>
            <span>COLLEGE STUDENT OFFER</span>
          </div>

          <h1>
            Special Support for<br />
            Your Project
          </h1>

          <div class="offer-underline" aria-hidden="true"></div>

          <a
            class="offer-button"
            href="https://wa.me/919345005902?text=Hello%20SENTKOM%2C%20I%20am%20a%20college%20student%20and%20would%20like%20to%20ask%20about%20your%20student%20project%20offer."
            target="_blank"
            rel="noopener"
          >
            See Offer Details <span aria-hidden="true">↗</span>
          </a>
        </div>

        <button class="offer-scroll-top" type="button" aria-label="Back to top">
          <span aria-hidden="true">↑</span>
        </button>
      </div>
    </main>
  </body>
</html>
